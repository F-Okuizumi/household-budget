<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">

  <title>家計管理</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="app">

    <header class="top">
      <h1>家計管理</h1>
      <button id="settings-open" class="icon" aria-label="月別設定">⚙</button>
    </header>

    <p id="status" role="status" hidden></p>

    <section class="summary" aria-label="予算概要">
      <div>
        <span>本日の収支</span>
        <strong id="today-balance">—</strong>
      </div>
      <div>
        <span>月末残予算</span>
        <strong id="month-end">—</strong>
      </div>
    </section>

    <section aria-label="月間カレンダー">

      <nav class="month-nav">
        <button id="prev-month" aria-label="前月">‹</button>
        <h2 id="month-label">年月</h2>
        <button id="next-month" aria-label="翌月">›</button>
      </nav>

      <div class="calendar weekdays" aria-hidden="true">
        <span>日</span>
        <span>月</span>
        <span>火</span>
        <span>水</span>
        <span>木</span>
        <span>金</span>
        <span>土</span>
      </div>

      <div id="calendar" class="calendar"></div>

      <p class="unit">単位：円</p>

    </section>

    <button id="today-add" class="primary wide">＋ 本日の支出を追加</button>

  </main>


  <dialog id="day-dialog">

    <header class="top">
      <h2 id="day-title">日別詳細</h2>
      <button class="icon" aria-label="閉じる" data-close>×</button>
    </header>

    <dl class="metrics">
      <div>
        <dt>日額予算</dt>
        <dd id="day-budget">—</dd>
      </div>
      <div>
        <dt>前日からの繰越</dt>
        <dd id="day-carry">—</dd>
      </div>
      <div>
        <dt>当日の支出合計</dt>
        <dd id="day-spent">—</dd>
      </div>
      <div class="total">
        <dt>利用可能額・超過額</dt>
        <dd id="day-available">—</dd>
      </div>
    </dl>

    <h3>支出履歴</h3>

    <div id="expense-list"></div>

    <button id="day-add" class="primary wide">＋ 支出を追加</button>

  </dialog>


  <dialog id="expense-dialog">

    <form id="expense-form">

      <header class="top">
        <h2 id="expense-title">支出を追加</h2>
        <button type="button" class="icon" data-close aria-label="閉じる">×</button>
      </header>

      <p id="expense-date"></p>

      <label for="expense-amount">支出金額（円）</label>

      <input
        id="expense-amount"
        inputmode="numeric"
        pattern="[0-9]+"
        required
        autocomplete="off"
      >

      <p class="error" id="expense-error" role="alert"></p>

      <button class="primary wide" type="submit">登録する</button>
      <button class="wide" type="button" data-close>キャンセル</button>

    </form>

  </dialog>


  <dialog id="settings-dialog">

    <form id="settings-form">

      <header class="top">
        <h2>月別設定</h2>
        <button type="button" class="icon" data-close aria-label="閉じる">×</button>
      </header>

      <p id="settings-month"></p>

      <label for="income">手取り収入（円）</label>

      <input
        id="income"
        inputmode="numeric"
        pattern="[0-9]+"
        required
      >

      <h3>固定費</h3>

      <div id="fixed-list"></div>

      <button type="button" id="fixed-add" class="wide">＋ 固定費を追加</button>

      <p>
        固定費合計
        <strong id="fixed-total">—</strong>
      </p>

      <fieldset>

        <legend>前月からの繰越額</legend>

        <label class="radio">
          <input type="radio" name="carry" value="auto" checked>
          自動計算
        </label>

        <label class="radio">
          <input type="radio" name="carry" value="manual">
          手動設定
        </label>

        <div id="manual-wrap" hidden>

          <label for="manual-carry">前月の予算超過額（円）</label>

          <input
            id="manual-carry"
            inputmode="numeric"
            pattern="[0-9]+"
          >

        </div>

        <p>
          適用する繰越額
          <strong id="applied-carry">—</strong>
        </p>

      </fieldset>

      <dl class="metrics">

        <div>
          <dt>月間予算</dt>
          <dd id="settings-budget">—</dd>
        </div>

        <div>
          <dt>日額予算</dt>
          <dd id="settings-daily">—</dd>
        </div>

        <div class="total">
          <dt>繰越反映後の月間予算</dt>
          <dd id="settings-effective">—</dd>
        </div>

      </dl>

      <p id="settings-error" class="error" role="alert"></p>

      <button class="primary wide" type="submit">保存する</button>
      <button class="wide" type="button" data-close>キャンセル</button>

    </form>

  </dialog>


  <script type="module" src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('Service Worker registered:', registration.scope);
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>

</body>
</html>
